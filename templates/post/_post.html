{% load static %}
<!-- post.html -->
<div class="card shadow-sm mb-4 mx-auto" style="max-width: 40rem;">
    {% include 'post/_post_header.html' %}
    <div class="card-body bg-light">
        <div class="d-flex justify-content-center align-items-center p-3">
            {% if book.cover %}
                <img src="{{ book.cover.url }}" class="img-fluid rounded shadow-sm" style="max-height: 500px;" alt="{{book.title}} Book Cover">
            {% else %}
                <div class="w-100 d-flex align-items-center justify-content-center bg-light rounded" style="height: 500px;">
                    <img src="{% static 'img/no_image.png' %}" class="opacity-50" style="width: 8rem; height: 8rem;" alt="No Image Available">
                </div>
            {% endif %}
        </div>
    </div>
    {% include 'post/_post_footer.html' %}
</div>
