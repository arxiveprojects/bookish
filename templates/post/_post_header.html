
<!-- templates/post/_post_header.html -->
{% load static %}
{% load humanize %} 

<div class="flex items-center justify-between py-4 px-4 border-b border-gray-100">
  <div class="flex items-center space-x-3">
    {% if book.user.image %}
      <img src="{{book.user.image.url}}" class="w-10 h-10 rounded-full object-cover border border-gray-200 shadow-sm">
    {% else %}
      <img src="{% static 'img/user.png' %}" class="w-10 h-10 rounded-full object-cover border border-gray-200">
    {% endif %}
    <div>
      <a href="{% url 'profile' book.user.id %}" 
         class="font-semibold text-gray-800 hover:text-blue-600 transition-colors">
        {{book.user.username}}
      </a>
      <p class="text-xs text-gray-500">{{book.posted_at|naturaltime}}</p>
    </div>
  </div>

  {% if book.user == user %}
  <div class="relative group z-10">
    <button class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition-colors">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
      </svg>
    </button>
    <div class="absolute right-0 w-36 bg-white rounded-md shadow-lg py-1 hidden group-hover:block transform transition-all duration-200 origin-top-right">
      <a href="{% url 'book_edit' book.id %}" class="block px-4 py-2 hover:bg-gray-100 text-gray-700 text-sm">
        <span class="flex items-center gap-2">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/>
          </svg>
          Edit
        </span>
      </a>
      <a href="{% url 'book_delete' book.id %}" class="block px-4 py-2 hover:bg-red-50 text-red-500 text-sm">
        <span class="flex items-center gap-2">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
          </svg>
          Delete
        </span>
      </a>
      <a id="visibility-toggle{{book.id}}" 
         class="block px-4 py-2 hover:bg-gray-100 text-gray-700 text-sm"
         hx-post="{% url 'book_visibility' book.id %}"
         hx-target="#visibility-toggle{{book.id}}"
         hx-swap="innerHTML">
        <span class="flex items-center gap-2">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            {% if book.public %}
            <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
            <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
            <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
            {% else %}
            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
            {% endif %}
          </svg>
          {% if book.public %}Make Private{% else %}Make Public{% endif %}
        </span>
      </a>
    </div>
  </div>
  {% endif %}
</div>
