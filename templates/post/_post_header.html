{% load static %}
{% load humanize %}
<!-- _post_header.html -->
<div class="d-flex align-items-center justify-content-between p-3 pb-2">
  <div class="d-flex align-items-center">
    <!-- Avatar with hover effect -->
    <a href="{% url 'profile' book.user.id %}" class="text-decoration-none">
      <div class="position-relative">
        {% if book.user.image %}
          <img src="{{book.user.image.url}}" class="rounded-circle" style="width: 48px; height: 48px;">
        {% else %}
          <img src="{% static 'img/user.png' %}" class="rounded-circle" style="width: 48px; height: 48px;">
        {% endif %}
      </div>
    </a>
    <!-- Username and timestamp -->
    <div class="ms-3">
      <a href="{% url 'profile' book.user.id %}" 
         class="fw-bold text-dark text-decoration-none">
        {{book.user.username}}
      </a>
      <p class="text-muted small">{{book.posted_at|naturaltime}}</p>
    </div>
  </div>

  <!-- Menu button with dropdown -->
  {% if book.user == user %}
  <div class="dropdown">
    <button class="btn btn-light btn-sm rounded-circle" type="button" id="dropdownMenuButton-{{book.id}}" data-bs-toggle="dropdown" aria-expanded="false">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots-vertical" viewBox="0 0 16 16">
        <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
      </svg>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton-{{book.id}}">
      <li>
        <a href="{% url 'book_edit' book.id %}" class="dropdown-item d-flex align-items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil me-2" viewBox="0 0 16 16">
            <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V12h2.293z"/>
          </svg>
          Edit
        </a>
      </li>
      <li>
        <a href="{% url 'book_delete' book.id %}" class="dropdown-item d-flex align-items-center text-danger">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash me-2" viewBox="0 0 16 16">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
          </svg>
          Delete
        </a>
      </li>
      <li>
        <a id="visibility-toggle{{book.id}}" 
            class="dropdown-item d-flex align-items-center"
            hx-post="{% url 'book_visibility' book.id %}"
            hx-target="#visibility-toggle{{book.id}}">
            <span class="d-flex align-items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash me-2" viewBox="0 0 16 16">
                {% if public %}
                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
                {% else %}
                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                {% endif %}
              </svg>
              {% if public %}Make Private{% else %}Make Public{% endif %}
            </span>
        </a>
      </li>
    </ul>
  </div>
  {% endif %}
</div>
