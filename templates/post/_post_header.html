{% load static %}
{% load humanize %}
<!-- _post_header.html -->
<div class="flex items-center justify-between p-4 pb-2">
  <div class="flex items-center space-x-3">
    <!-- Avatar with hover effect -->
    <a href="{% url 'profile' book.user.id %}" class="group block">
      <div class="relative rounded-full ring-2 ring-white transition-all duration-200 group-hover:ring-blue-100">
        {% if book.user.image %}
          <img src="{{book.user.image.url}}" class="w-12 h-12 rounded-full">
        {% else %}
          <img src="{% static 'img/user.png' %}" class="w-12 h-12 rounded-full">
        {% endif %}
      </div>
    </a>
    <!-- Username and timestamp -->
    <div>
      <a href="{% url 'profile' book.user.id %}" 
         class="font-semibold text-gray-900 hover:text-blue-600 transition-colors">
        {{book.user.username}}
      </a>
      <p class="text-xs text-gray-500 font-medium">{{book.posted_at|naturaltime}}</p>
    </div>
  </div>

  <!-- Menu button with smoother dropdown -->
  {% if book.user == user %}
  <div class="relative group">
    <button class="p-2 hover:bg-gray-100 rounded-full transition-colors duration-200">
      <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 16 16">
        <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
      </svg>
    </button>
    <div class="absolute right-0 w-40 bg-white rounded-lg shadow-lg py-2 opacity-0 group-hover:opacity-100 transition-all duration-200 origin-top-right border border-gray-100">
      <a href="{% url 'book_edit' book.id %}" class="flex items-center px-4 py-2.5 hover:bg-gray-50 text-gray-700">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
        </svg>
        Edit
      </a>
      <a href="{% url 'book_delete' book.id %}" class="flex items-center px-4 py-2.5 hover:bg-gray-50 text-red-600">
        <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        Delete
      </a>
      <a id="visibility-toggle{{book.id}}" 
          class="flex items-center px-4 py-2.5 hover:bg-gray-50 text-gray-700"
          hx-post="{% url 'book_visibility' book.id %}"
          hx-target="#visibility-toggle{{book.id}}">
          <span class="flex items-center gap-2">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
              {% if public %}
              <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
              <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
              <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
              {% else %}
              <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
              <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
              {% endif %}
            </svg>
            {% if public %}Make Private{% else %}Make Public{% endif %}
        </span>
      </a>
    </div>
  </div>
  {% endif %}
</div>
