{% extends '_base.html' %}

{% block title %} Edit Profile {% endblock title %}

{% block content %}

<div class="flex justify-center">
    <div class="bg-gray-100 border border-gray-300 shadow-md rounded-lg p-6 w-full max-w-lg">
        <div class="border-b pb-2 mb-4">
            <h5 class="text-lg font-semibold">Edit Profile</h5>
        </div>  

        <form action="" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            <div class="mt-4">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition" type="submit">
                    Edit
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
