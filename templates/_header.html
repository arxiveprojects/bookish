{% load static %}
<header class="py-3 sticky-top bg-light px-4 top-0 mb-3 border-bottom">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-3">
                <a href="{% url 'book_list' %}" class="mb-2 md-mb-0 text-dark text-decoration-none">
                    <img src="{% static 'img/favicon.png' %}" alt="book logo" width="48" height="48" class="rounded-circle">
                </a>
            </div>
            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between">
                    <form action="{% url 'book_search' %}" method="get" class="w-100 me-3" role="search">
                        <input name="q" class="form-control" placeholder="Search..." aria-label="Search">
                    </form>
                    {% if not request.user.is_authenticated %}
                        <a href="{% url 'login' %}" class="btn btn-primary">
                            Login
                        </a>
                    {% else %}
                        <div class="dropdown">
                            <button id="user-menu-button" class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                {% if request.user.image %}
                                    <img src="{{request.user.image.url}}" alt="user dp" width="48" height="48" class="rounded-circle">
                                {% else %}
                                    <img src="{% static 'img/user.png' %}" alt="not available" width="48" height="48" class="rounded-circle">
                                {% endif %}
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="user-menu-button">
                                <li>
                                    <a class="dropdown-item" href="{% url 'profile' %}">
                                        {{ request.user.first_name|default:request.user.username }}'s Profile
                                    </a>
                                </li>
                                <li><a class="dropdown-item" href="#">Settings</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form action="{% url 'logout' %}" method="post">
                                        {% csrf_token %}
                                        <button class="dropdown-item" type="submit">Logout</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</header>
