{% load static %}
<header class="navbar fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'book_list' %}">
            <img src="{% static 'img/favicon.png' %}" alt="book logo" width="30" height="30" class="d-inline-block align-top me-2">
            Bookish
        </a>
        <div class="d-flex align-items-center ms-auto">
            <form action="{% url 'book_search' %}" method="get" class="d-flex me-3">
                <input name="q" class="form-control rounded-pill" type="search" placeholder="Search..." aria-label="Search" style="width: 250px;">
            </form>
            {% if not request.user.is_authenticated %}
                <a href="{% url 'login' %}" class="btn btn-primary">
                    Login
                </a>
            {% else %}
                <div class="dropdown">
                    <button id="user-menu-button" class="btn btn-link p-0 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        {% if request.user.image %}
                            <img src="{{request.user.image.url}}" alt="user dp" width="30" height="30" class="rounded-circle">
                        {% else %}
                            <img src="{% static 'img/user.png' %}" alt="not available" width="30" height="30" class="rounded-circle">
                        {% endif %}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="user-menu-button">
                        <li>
                            <a class="dropdown-item" href="{% url 'profile' %}">
                                {{ request.user.first_name|default:request.user.username }}'s Profile
                            </a>
                        </li>
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form action="{% url 'logout' %}" method="post">
                                {% csrf_token %}
                                <button class="dropdown-item" type="submit">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% endif %}
        </div>
    </div>
</header>
