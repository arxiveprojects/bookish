{% load static %}
<header class="py-3 sticky bg-white px-4 top-0 mb-3 border-b border-gray-200 dark:border-gray-700">
    <div class="container mx-auto grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
     
      <a href="{% url 'book_list' %}" class="mb-2 md:mb-0 text-gray-800 dark:text-gray-200 hover:text-primary">
          <img src="{% static 'img/favicon.png' %}" alt="book logo" width="48" height="48" class="rounded-full">
      </a>
    
      <div class="flex items-center col-span-2 justify-between">
        <form action="{% url 'book_search' %}" method="get" class="w-full mr-3" role="search">
          <input name="q" class="w-full rounded-md border border-gray-300 dark:border-gray-700 px-4 py-2 bg-white dark:bg-gray-800 focus:ring-primary focus:border-primary" placeholder="Search..." aria-label="Search">
        </form>
        
        {% if not request.user.is_authenticated %}
        <a href="{% url 'login' %}" class="flex items-center text-primary hover:text-primary-hover">
          Login
        </a>
        {% else %}
          <div class="relative">
            <button id="user-menu-button" class="flex items-center focus:outline-none" data-dropdown-toggle="user-dropdown" aria-expanded="false">
              {% if request.user.image %}
                  <img src="{{request.user.image.url}}" alt="user dp" width="48" height="48" class="rounded-full">
              {% else %}
                  <img src="{% static 'img/user.png' %}" alt="not available" width="48" height="48" class="rounded-full">
              {% endif %}
            </button>
            <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 z-50">
              <a href="{% url 'profile' %}" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                {{ request.user.first_name|default:request.user.username}}'s Profile
              </a>
              <a href="#" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Settings</a>
              <hr class="my-1 border-gray-200 dark:border-gray-700">
              <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700" type="submit">Logout</button>
              </form>
            </div>
          </div>
        {% endif %}
      </div>
    </div>
</header>

<script>
  // Toggle dropdown
  document.addEventListener('DOMContentLoaded', function() {
    const dropdownButton = document.getElementById('user-menu-button');
    const dropdown = document.getElementById('user-dropdown');
    
    if (dropdownButton && dropdown) {
      dropdownButton.addEventListener('click', function() {
        dropdown.classList.toggle('hidden');
      });
      
      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        if (!dropdownButton.contains(event.target) && !dropdown.contains(event.target)) {
          dropdown.classList.add('hidden');
        }
      });
    }
  });
</script>
