{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Bookish Pdf {% endblock title %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.png' %}" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" >
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'css/instagram_style.css' %}" />
  </head>
  <body>
   
    <div class="container py-4">
      {% include "_header.html" %} {% block content %} {% endblock content %}
    </div>
    
    
    
    <script>
      document.body.addEventListener("htmx:configRequest", (event) => {
        event.detail.headers["X-CSRFToken"] = "{{ csrf_token }}"; //insert csrf token when performing AJAX request
      });
    </script>

    <script src="{% static 'js/index.js' %}" defer></script>
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    <!-- Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <style>
      .htmx-indicator {
        opacity: 0;
        transition: opacity 500ms ease-in;
      }
      .htmx-request .htmx-indicator {
        opacity: 1;
      }
      .htmx-request.htmx-indicator {
        opacity: 1;
      }
    </style>
  </body>
</html>
