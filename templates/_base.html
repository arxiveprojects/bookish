{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Bookish Pdf {% endblock title %}</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="{% static 'img/favicon.png' %}"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}" />
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200">
   
    <div class="container mx-auto max-w-6xl px-1 pb-8">
      {% include "_header.html" %} {% block content %} {% endblock content %}
    </div>
    
    
    
    <script>
      document.body.addEventListener("htmx:configRequest", (event) => {
        event.detail.headers["X-CSRFToken"] = "{{ csrf_token }}"; //insert csrf token when performing AJAX request
      });
    </script>

    <script src="{% static 'js/index.js' %}" defer></script>
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#3b82f6",
                hover: "#2563eb",
              },
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .htmx-indicator {
          opacity: 0;
          transition: opacity 500ms ease-in;
        }
        .htmx-request .htmx-indicator {
          opacity: 1;
        }
        .htmx-request.htmx-indicator {
          opacity: 1;
        }
      }
    </style>
  </body>
</html>
