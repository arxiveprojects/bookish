{% load widget_tweaks %}

<form method="{{ method|default:'POST' }}" {% if enctype %}enctype="{{ enctype }}"{% endif %}>
  {% csrf_token %}
  
  {% for field in form %}
    {% include "partial/_form_field.html" with field=field %}
  {% endfor %}

  <div class="d-grid mt-4">
    <button type="submit" class="btn btn-primary">
      {{ submit_text|default:"Submit" }}
    </button>
  </div>
</form>
