<!-- partial/message.html -->
{% load humanize %}
{% load markdown_filter %}

<div id="message-{{ message.id }}" class="group animate-fade-in">
  <div class="flex flex-col space-y-3 p-2 hover:bg-gray-50/50 rounded-lg transition-colors">
    
    <!-- User Query -->
    <div class="flex justify-end">
      <div class="relative max-w-[85%] break-words bg-gradient-to-br from-blue-600 to-blue-500 text-white px-4 py-3 rounded-2xl rounded-br-none shadow-lg">
        <p class="text-sm leading-relaxed">{{ message.query }}</p>
        <span class="block text-xs text-blue-100/90 text-right mt-1.5">{{ message.timestamp|naturaltime }}</span>
      </div>
    </div>

    <!-- AI Response -->
    {% if message.response %}
      <div class="flex justify-start">
        <div class="relative max-w-[85%] break-words bg-white border border-gray-100 px-4 py-3 rounded-2xl rounded-bl-none shadow-lg">
          <p class="text-sm text-gray-800 leading-relaxed">{{ message.response |markdown|safe }}</p>
          <span class="block text-xs text-gray-500/90 mt-1.5">{{ message.timestamp|naturaltime }}</span>
        </div>
      </div>
    {% else %}
      <div class="flex justify-start"
           hx-get="{% url 'generate_response' message.id %}"
           hx-trigger="load"
           hx-swap="outerHTML">
        <div class="relative max-w-[85%] break-words bg-white border border-gray-100 px-4 py-3 rounded-2xl rounded-bl-none shadow-lg">
          <div class="flex items-center space-x-2 text-gray-500">
            <div class="animate-spin h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full"></div>
            <span class="text-sm">Analyzing...</span>
          </div>
        </div>
      </div>
    {% endif %}

  </div>
</div>
