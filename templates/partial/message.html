<!-- partial/message.html -->
{% load humanize %}
{% load markdown_filter %}

<div id="message-{{ message.id }}" class="group animate-fade-in">
  <div class="d-flex flex-column p-2">
    
    <!-- User Query -->
    <div class="d-flex justify-content-end mb-3">
      <div class="bg-primary text-white p-3 rounded-3" style="max-width: 85%; border-bottom-right-radius: 0 !important;">
        <p class="small">{{ message.query }}</p>
        <span class="d-block small text-light text-end mt-1">{{ message.timestamp|naturaltime }}</span>
      </div>
    </div>

    <!-- AI Response -->
    {% if message.response %}
      <div class="d-flex justify-content-start">
        <div class="bg-white border p-3 rounded-3" style="max-width: 85%; border-bottom-left-radius: 0 !important;">
          <p class="small text-dark">{{ message.response |markdown|safe }}</p>
          <span class="d-block small text-muted mt-1">{{ message.timestamp|naturaltime }}</span>
        </div>
      </div>
    {% else %}
      <div class="d-flex justify-content-start"
           hx-get="{% url 'generate_response' message.id %}"
           hx-trigger="load"
           hx-swap="outerHTML">
        <div class="bg-white border p-3 rounded-3" style="max-width: 85%; border-bottom-left-radius: 0 !important;">
          <div class="d-flex align-items-center text-muted">
            <div class="spinner-border spinner-border-sm text-primary me-2" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <span class="small">Analyzing...</span>
          </div>
        </div>
      </div>
    {% endif %}

  </div>
</div>
