<!-- partial/more_images.html -->
{% for img in images %}
<div class="col-6 col-md-4 col-lg-3 mb-4" {% if forloop.last %} hx-get="{% url 'get_book_images' book.id %}?offset={{offset|default:1}}" hx-trigger="intersect once" hx-swap="afterend" hx-target="this" {% endif %}>
    <img class="img-fluid rounded cursor-pointer" style="object-fit: cover; width: 100%; height: 200px;" 
         src="data:image/png;base64,{{ img }}"
         alt="{{book.title}}"
         onclick="openModal(this.src)">
    {% if forloop.last %}
    <span class="spinner-border htmx-indicator" role="status"></span>
    {% endif %}
</div>
{% endfor %}
