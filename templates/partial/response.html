<!-- partial/response.html -->
{% load humanize %}
{% load markdown_filter %}

<div class="d-flex justify-content-start">
    <div class="bg-white border p-3 rounded-3" style="max-width: 85%; border-bottom-left-radius: 0 !important;">
      <p class="small text-dark">{{ message.response|markdown|safe }}</p>
      <span class="d-block small text-muted mt-1">{{ message.timestamp|naturaltime }}</span>
    </div>
</div>
