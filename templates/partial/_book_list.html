{% for book in books %}
  <div 
    {% if forloop.last %}
      hx-get="{% url 'more_books' %}?offset=3"
      hx-trigger="revealed"
      hx-swap="afterend"
    {% endif %}

    {% include 'post/_post.html' %}

      <span class="visually-hidden">Loading...</span>
    {% endif %}
  </div>
{% endfor %}
