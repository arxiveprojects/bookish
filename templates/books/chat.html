<!-- Chat UI -->
<div class="w-100 mx-auto" style="max-width: 800px;">
    <!-- Chat Box -->
    <div id="chat-box" class="overflow-auto shadow-lg rounded-3 p-4 bg-light" style="height: 500px;">
      <div id="messages" hx-get="{% url 'messages' book.id %}" hx-trigger="load" hx-swap="innerHTML">
        <!-- Messages will be loaded here -->
      </div>
    </div>
  
    <!-- Chat Input -->
    <form hx-post="{% url 'message' book.id %}" 
        hx-target="#messages" 
        hx-swap="beforeend"
        class="d-flex align-items-center gap-3 mt-4 p-2 bg-white rounded-3 shadow-lg">
          {% csrf_token %}
          <input type="text" name="query" placeholder="Ask something..." required
              class="form-control border-0 bg-transparent px-4 py-3">
          <button type="submit" class="btn btn-link text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
              <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11zM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493z"/>
            </svg>
          </button>
    </form>
  </div>

  
  
  <script>
document.addEventListener('htmx:afterRequest', function(evt) {
  // Clear input after successful message submission
  if (evt.detail.successful && evt.detail.requestConfig.elt.tagName === 'FORM') {
    const input = document.querySelector('input[name="query"]');
    input.value = '';
    input.focus();
    
   }
});


    document.addEventListener('htmx:afterSwap', function(evt) {
      // Only run for messages container updates
      if (evt.detail.target.id === 'messages') {
        const chatBox = document.getElementById('chat-box');
        // Smooth scroll to bottom
        chatBox.scrollTo({
          top: chatBox.scrollHeight,
          behavior: 'smooth'
        });
      }
    });
    
    // Initial scroll when page loads
    window.addEventListener('load', function() {
      const chatBox = document.getElementById('chat-box');
      chatBox.scrollTop = chatBox.scrollHeight;
    });
    </script>
