{% extends '_base.html' %}

{% block title %} {{ book.title }} {% endblock title %}

{% block content %}

    {% include 'post/_post.html' %}      

<!-- Chat UI -->
<div class="max-w-4xl mx-auto mt-6 p-4 bg-gray-100 shadow-md rounded-lg">
  <h2 class="text-center text-lg font-semibold mb-2">Chat</h2>

  <!-- Chat Box -->
  <div id="chat-box" class="h-60 overflow-y-auto border border-gray-300 rounded-md p-3 bg-white space-y-3">
      <div id="messages" hx-get="{% url 'messages' book.id %}" hx-trigger="load" hx-swap="innerHTML"></div>
  </div>

  <!-- Chat Input -->
  <form hx-post="{% url 'message' book.id %}" hx-target="#messages" hx-swap="beforeend"
        class="flex items-center gap-2 mt-3">
      {% csrf_token %}
      <input type="text" name="query" placeholder="Ask something..." required
             class="w-full border border-gray-300 p-2 rounded-md focus:ring focus:ring-blue-300">
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition">
          Send
      </button>
  </form>
</div>

{% endblock %}
